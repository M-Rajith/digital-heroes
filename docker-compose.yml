version: "3.9"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: digital_heroes
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .                    # repo root — Dockerfile COPYs apps/api/... & packages/database/...
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/digital_heroes?schema=public
      DIRECT_URL: postgresql://postgres:postgres@db:5432/digital_heroes?schema=public
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }
    # runtime image has prisma schema at ./prisma (copied from packages/database/prisma)
    # db push syncs schema directly (no migration history ships with this scaffold)
    command: sh -c "npx prisma db push --schema ./prisma/schema.prisma && node dist/main.js"

  web:
    build:
      context: .                    # repo root — Dockerfile COPYs apps/web/...
      dockerfile: apps/web/Dockerfile
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
